    ${edit ? html`<div class="modal" onClick=${x=>x.target===x.currentTarget&&setEdit(null)}>

/* Resume o estado de um canal de entrega. Um pedido pode ter varios ingressos,
   entao mostra o pior caso: se um falhou, o pedido nao esta entregue. */
function SeloEntrega({pago,msgs,lista}){
  if(!pago) return html`<span class="mute">—</span>`;
  if(lista) return html`<span class="mute" title="Entrada por lista: vale o nome">lista</span>`;
  const l = msgs || [];
  if(!l.length) return html`<span class="pill pendente">na fila</span>`;
  const st = l.map(m=>m.status);
  if(st.some(s=>s==='FALHOU'))   return html`<span class="pill ruim">falhou</span>`;
  if(st.some(s=>s==='PENDENTE'||s==='ENVIANDO'))
    return html`<span class="pill pendente">enviando</span>`;
  return html`<span class="pill pago">enviado</span>`;
}

/* ============ CUPONS DE DESCONTO ============
   O desconto real é sempre recalculado no servidor na hora da compra. Esta tela
   só cadastra a regra — nenhum preço é decidido aqui. */
const CUPOM_VAZIO = {codigo:'',tipo:'percentual',valor:'',evento_id:'',min_quantidade:1,
  limite_usos:'',valido_de:'',valido_ate:'',ativo:true,descricao:''};

function AdmCupons({flash}){
  const [lista,setLista]=useState(null); const [evs,setEvs]=useState([]);
  const [edit,setEdit]=useState(null); const [err,setErr]=useState('');
  const carregar = useCallback(()=>db.rpc('ev_cupons_listar').then(({data})=>setLista(data||[])),[]);
  useEffect(()=>{ carregar();
    db.from('ev_eventos').select('id,nome,data').order('data',{ascending:false})
      .then(({data})=>setEvs(data||[])); },[carregar]);

  async function salvar(){
    setErr('');
    const c = Object.assign({}, edit);
    const id = c.id;
    if(!(c.codigo||'').trim()) return setErr('Digite o código do cupom.');
    if(!/^[A-Za-z0-9_-]{3,24}$/.test(c.codigo.trim()))
      return setErr('Use de 3 a 24 letras ou números, sem espaço e sem acento.');
    const val = Number(String(c.valor).replace(',','.'));
    if(!val || val <= 0) return setErr('Informe um valor maior que zero.');
    if(c.tipo === 'percentual' && val > 100) return setErr('Porcentagem não pode passar de 100.');

    const dados = {
      codigo: c.codigo.trim().toUpperCase(), tipo: c.tipo, valor: val,
      evento_id: c.evento_id || null,
      min_quantidade: Number(c.min_quantidade) || 1,
      limite_usos: c.limite_usos === '' || c.limite_usos === null ? null : Number(c.limite_usos),
      valido_de: c.valido_de || null, valido_ate: c.valido_ate || null,
      ativo: c.ativo !== false, descricao: (c.descricao||'').trim() || null,
    };
    const {error} = id ? await db.from('ev_cupons').update(dados).eq('id',id)
                       : await db.from('ev_cupons').insert(dados);
    if(error){
      return setErr(error.message.indexOf('duplicate')>=0 || error.message.indexOf('uniq')>=0
        ? 'Já existe um cupom com esse código.' : error.message);
    }
    setEdit(null); flash('Cupom salvo'); carregar();
  }

  async function alternar(c){
    await db.from('ev_cupons').update({ativo: !c.ativo}).eq('id',c.id);
    flash(c.ativo ? 'Cupom desativado' : 'Cupom ativado'); carregar();
  }
  async function excluir(c){
    if(c.usos > 0)
      return alert('Esse cupom já foi usado em ' + c.usos + ' compra(s) e não pode ser excluído — '
        + 'o histórico dos pedidos perderia a referência. Desative-o.');
    if(!confirm('Excluir o cupom ' + c.codigo + '?')) return;
    await db.from('ev_cupons').delete().eq('id',c.id);
    flash('Cupom excluído'); carregar();
  }

  const rotuloValor = c => c.tipo === 'percentual'
    ? String(Number(c.valor)).replace('.',',') + '%' : brl(c.valor);

  return html`<div>

    ${edit ? html`<div class="modal" onClick=${x=>x.target===x.currentTarget&&setEdit(null)}>

/* ============ EQUIPE DE PORTARIA ============ */
function AdmEquipe({flash}){
  const [ops,setOps]=useState(null); const [evs,setEvs]=useState([]);
  const [edit,setEdit]=useState(null); const [err,setErr]=useState('');
  const [salvando,setSalv]=useState(false);
  const carregar = useCallback(()=>db.rpc('ev_operadores_listar')
    .then(({data})=>setOps(data||[])),[]);
  useEffect(()=>{ carregar();
    db.from('ev_eventos').select('id,nome,data').order('data',{ascending:false})
      .then(({data})=>setEvs(data||[])); },[carregar]);

  // Cria o login de verdade (nome/e-mail/senha) sem passar pelo Supabase.
  // A senha vai direto pro backend e nunca fica guardada em lugar nenhum aqui.
  async function criar(){
    setErr('');
    if(edit.nome.trim().length<3) return setErr('Informe o nome completo.');
    if(!emailOk(edit.email))      return setErr('E-mail inválido.');
    if((edit.senha||'').length<8) return setErr('A senha precisa de pelo menos 8 caracteres.');
    if(!(edit.eventos||[]).length)return setErr('Escolha pelo menos uma festa.');
    setSalv(true);
    try{
      const {data:{session}} = await db.auth.getSession();
      const r = await fetch(SUPABASE_URL+'/functions/v1/ingressos-equipe',{
        method:'POST',
        headers:{'Content-Type':'application/json', apikey:SUPABASE_ANON,
                 Authorization:'Bearer '+session.access_token},
        body: JSON.stringify({acao:'criar', nome:edit.nome.trim(), email:edit.email.trim(),
          senha:edit.senha, telefone:edit.telefone||null, eventos:edit.eventos})});
      const j = await r.json();
      if(!r.ok) throw new Error(j.erro||'Não deu para criar o operador.');
      setEdit(null); flash('Operador criado e liberado'); carregar();
    }catch(e){ setErr(e.message); }
    setSalv(false);
  }

  async function decidir(o, decisao, eventos){
    if(decisao==='recusado' && !confirm('Recusar o acesso de '+o.nome+'?')) return;
    const {error} = await db.rpc('ev_operador_decidir',
      {p_user:o.user_id, p_decisao:decisao, p_eventos:eventos||null});
    if(error) return alert('Não deu para salvar: '+error.message);
    flash(decisao==='aprovado' ? 'Operador aceito' : 'Acesso removido');
    carregar();
  }

  const alternar = id => setEdit(e=>{
    const l = (e.eventos||[]).slice(); const i = l.indexOf(id);
    if(i>=0) l.splice(i,1); else l.push(id);
    return Object.assign({},e,{eventos:l});
  });

  const pendentes = (ops||[]).filter(o=>o.situacao==='pendente');
  const resto     = (ops||[]).filter(o=>o.situacao!=='pendente');

  return html`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap">
      <h2 class="dsp" style="font-size:32px">Equipe de portaria</h2>
      <button class="btn" onClick=${()=>setEdit({nome:'',email:'',senha:'',telefone:'',eventos:[]})}>
        Cadastrar operador</button>
    </div>
    <p class="mute" style="font-size:14px;margin-bottom:22px">
      O operador entra em <b class="mono" style="color:var(--bone)">${baseURL()}#/checkin</b> e só vê a
      tela de validação — nunca faturamento, vendas ou clientes. Quem se cadastra sozinho por lá
      fica aguardando você aceitar aqui.</p>

    ${pendentes.length ? html`<div style="margin-bottom:26px">
      <div class="eyebrow"><i class="chev"></i>Aguardando sua aprovação (${pendentes.length})</div>
      ${pendentes.map(o=>html`<${LinhaPendente} key=${o.user_id} o=${o} evs=${evs} decidir=${decidir}/>`)}
    </div>` : null}

    ${!ops ? html`<div class="skel" style="height:160px"></div>`
      : resto.length===0 && !pendentes.length
      ? html`<div class="panel"><h3 class="dsp" style="font-size:20px">Nenhum operador ainda</h3>
          <p class="mute" style="margin-top:8px">Cadastre a equipe da portaria com nome, e-mail e senha —
          ou peça para eles se cadastrarem em <b class="mono">#/checkin</b> e aceite por aqui.</p></div>`
      : html`<div class="tblwrap"><table>
        <thead><tr><th>Operador</th><th>E-mail</th><th>Festas</th><th>Validações</th><th>Situação</th><th></th></tr></thead>
        <tbody>${resto.map(o=>html`<tr key=${o.user_id}>
          <td><b>${o.nome}</b>${o.telefone ? html`<div class="mute" style="font-size:11px">${mascFone(o.telefone)}</div>` : null}</td>
          <td class="mute">${o.email}</td>
          <td>${(o.eventos||[]).map(e=>e.nome).join(', ')||'—'}</td>
          <td class="mono">${o.validacoes}</td>
          <td><span class=${'pill '+(o.situacao==='aprovado'?'pago':'ruim')}>
            ${o.situacao==='aprovado'?'ativo':'sem acesso'}</span></td>
          <td><div style="display:flex;gap:6px">
            ${o.situacao==='aprovado'
              ? html`<button class="btn ghost sm" onClick=${()=>decidir(o,'recusado')}>Remover acesso</button>`
              : html`<button class="btn ghost sm" onClick=${()=>decidir(o,'aprovado')}>Reativar</button>`}
          </div></td>
        </tr>`)}</tbody></table></div>`}

    ${edit ? html`<div class="modal" onClick=${x=>x.target===x.currentTarget&&setEdit(null)}>
      <div class="box">
        <h3 class="dsp" style="font-size:24px;margin-bottom:8px">Cadastrar operador</h3>
        <p class="mute" style="font-size:13px;margin-bottom:18px">
          O login é criado na hora. Passe o e-mail e a senha para a pessoa da portaria.</p>
        ${err ? html`<div class="err">${err}</div>` : null}
        <${Campo} l="Nome completo" v=${edit.nome} on=${v=>setEdit(Object.assign({},edit,{nome:v}))}/>
        <${Campo} l="E-mail" t="email" v=${edit.email} on=${v=>setEdit(Object.assign({},edit,{email:v}))}/>
        <${Campo} l="Senha (mínimo 8 caracteres)" t="password" v=${edit.senha}
          on=${v=>setEdit(Object.assign({},edit,{senha:v}))}/>
        <${Campo} l="Telefone (opcional)" v=${edit.telefone}
          on=${v=>setEdit(Object.assign({},edit,{telefone:mascFone(v)}))}/>
        <div class="field"><label>Festas que pode validar</label>
          <div style="display:grid;gap:8px">
            ${evs.map(e=>html`<label key=${e.id} class="ck-hit" style="cursor:pointer">
              <span><b>${e.nome}</b><div class="mute" style="font-size:12px">${dataBR(e.data)}</div></span>
              <input type="checkbox" style="width:22px;height:22px" checked=${(edit.eventos||[]).indexOf(e.id)>=0}
                onChange=${()=>alternar(e.id)}/></label>`)}
          </div></div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn" style="flex:1" onClick=${criar} disabled=${salvando}>
            ${salvando?'Criando…':'Criar e liberar'}</button>
          <button class="btn ghost" onClick=${()=>setEdit(null)}>Cancelar</button>
        </div>
      </div></div>` : null}
  </div>`;
}

/* Cartao de quem se cadastrou sozinho: aceitar exige escolher as festas,
   senao o operador entraria aprovado mas sem poder validar nada. */
function LinhaPendente({o,evs,decidir}){
  const [sel,setSel] = useState([]);
  const marcar = id => setSel(l => l.indexOf(id)>=0 ? l.filter(x=>x!==id) : l.concat([id]));
  return html`<div class="panel" style="margin-bottom:12px;border-color:var(--ember)">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div>
        <b style="font-size:17px">${o.nome}</b>
        <div class="mute" style="font-size:13px">${o.email}${o.telefone ? ' · '+mascFone(o.telefone) : ''}</div>
        <div class="mute" style="font-size:12px;margin-top:4px">
          Pediu acesso em ${new Date(o.criado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</div>
      </div>
      <span class="pill pendente">aguardando</span>
    </div>
    <div class="field" style="margin-top:16px"><label>Liberar para quais festas</label>
      <div style="display:grid;gap:8px">
        ${evs.map(e=>html`<label key=${e.id} class="ck-hit" style="cursor:pointer">
          <span><b>${e.nome}</b><div class="mute" style="font-size:12px">${dataBR(e.data)}</div></span>
          <input type="checkbox" style="width:22px;height:22px" checked=${sel.indexOf(e.id)>=0}
            onChange=${()=>marcar(e.id)}/></label>`)}
      </div></div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" disabled=${!sel.length}
        onClick=${()=>decidir(o,'aprovado',sel)}>
        ${sel.length ? 'Aceitar' : 'Escolha ao menos uma festa'}</button>
      <button class="btn ghost" onClick=${()=>decidir(o,'recusado')}>Recusar</button>
    </div>
  </div>`;
}

  ['Título da home', 'A primeira coisa que a pessoa lê ao abrir o site.', [

    ['hero_destaque', 'Segunda linha (em destaque)', 'texto', 'Ex: é nossa.'],

  ]],
  ['Informações ao público', 'Bloco "Antes de vir" e faixa de aviso no topo.', [

     'Regras da casa, o que levar, política de entrada. Uma linha por assunto.'],
    ['aviso_topo', 'Aviso em destaque no topo', 'texto',
     'Ex: Vendas do 2º lote abrem sexta às 10h (vazio = não aparece)'],
  ]],
  ['Contato', 'Botões de contato e a mensagem de confirmação da compra.', [
    ['whatsapp_number', 'WhatsApp (só números, com 55)', 'texto', 'Ex: 5598981686676'],
    ['instagram', 'Link do Instagram', 'texto', 'https://instagram.com/...'],
    ['email_contato', 'E-mail de contato', 'texto', 'contato@suacasa.com.br'],
    ['logo_url', 'URL do logo', 'texto', 'Opcional'],
  ]],
];
const TODAS_CHAVES = GRUPOS.flatMap(g => g[2].map(c => c[0]));

function AdmConfig({flash}){
  const [v,setV]     = useState(null);
  const [orig,setOr] = useState(null);
  const [salv,setSa] = useState(false);

  const carregar = useCallback(()=>db.from('ev_config').select('*').then(({data})=>{
    const o = {};
    (data||[]).forEach(r=>{ o[r.chave] = typeof r.valor === 'string' ? r.valor : String(r.valor ?? ''); });
    TODAS_CHAVES.forEach(k=>{ if(o[k] === undefined) o[k] = ''; });
    setV(o); setOr(JSON.stringify(o));
  }),[]);
  useEffect(()=>{carregar()},[carregar]);

  const mudou = v && orig && JSON.stringify(v) !== orig;

  async function salvar(){
    setSa(true);
    for(const k of TODAS_CHAVES){
      const {error} = await db.from('ev_config').upsert({chave:k, valor: v[k] ?? ''});
      if(error){ setSa(false); return alert('Não deu para salvar "'+k+'": '+error.message); }
    }
    setSa(false); setOr(JSON.stringify(v));
    flash('Página de vendas atualizada');
  }

  if(!v) return html`<div class="skel" style="height:220px"></div>`;

  return html`<div style="max-width:640px">
    <h2 class="dsp" style="font-size:32px;margin-bottom:6px">Página de vendas</h2>
    <p class="mute" style="font-size:14px;margin-bottom:24px">

      já está no ar — não precisa me chamar.</p>

    ${GRUPOS.map(([titulo, ajuda, campos])=>html`
      <div class="panel" style="margin-bottom:16px" key=${titulo}>
        <div class="dsp" style="font-size:19px">${titulo}</div>
        <p class="mute" style="font-size:12.5px;margin:4px 0 18px">${ajuda}</p>
        ${campos.map(([chave, rotulo, tipo, dica])=>html`
          <div class="field" key=${chave}>
            <label>${rotulo}</label>
            ${tipo === 'area'
              ? html`<textarea rows="4" value=${v[chave]||''} placeholder=${dica}
                  onInput=${x=>setV(Object.assign({},v,{[chave]:x.target.value}))}></textarea>`
              : html`<input value=${v[chave]||''} placeholder=${dica}
                  onInput=${x=>setV(Object.assign({},v,{[chave]:x.target.value}))}/>`}
            ${dica && tipo === 'area' ? html`<div class="mute" style="font-size:11.5px;margin-top:6px">${dica}</div>` : null}
          </div>`)}
      </div>`)}

    <div style="position:sticky;bottom:16px;z-index:5">
      <button class="btn wide" onClick=${salvar} disabled=${salv||!mudou}>
        ${salv ? 'Salvando…' : mudou ? 'Salvar e publicar no site' : 'Nada alterado'}</button>
    </div>

    <div class="panel" style="margin-top:22px">
      <div class="eyebrow"><i class="chev"></i>Integrações</div>
      <p class="mute" style="font-size:13px;margin-bottom:10px">
        Pagamento por Pix via <b style="color:var(--bone)">SyncPay</b> e entrega dos ingressos
        em PDF por <b style="color:var(--bone)">e-mail automático</b>. As credenciais ficam
        guardadas no servidor e nunca passam pelo navegador.</p>
      <p class="mute" style="font-size:13px">
        Assim que o Pix cai, o ingresso é gerado e enviado sozinho. Se o envio falhar,
        o pedido fica marcado em <b style="color:var(--bone)">Pedidos</b> e dá para reenviar de lá.</p>
    </div>

    <${ZonaPerigo} flash=${flash}/>
  </div>`;
}

/* Zona de exclusão. Fica no fim, separada, e exige digitar APAGAR — não é
   coisa que se clique sem querer no meio de um sábado. */
function ZonaPerigo({flash}){
  const [evs,setEvs]   = useState([]);
  const [alvo,setAlvo] = useState('');
  const [conf,setConf] = useState('');
  const [ocupado,setOc]= useState(false);
  const [erro,setErro] = useState('');
  const [res,setRes]   = useState(null);

  useEffect(()=>{ db.from('ev_eventos').select('id,nome,data').order('data',{ascending:false})
    .then(({data})=>setEvs(data||[])); },[]);

  async function apagar(){
    setErro(''); setRes(null);
    if(conf.trim().toUpperCase() !== 'APAGAR') return setErro('Digite APAGAR para confirmar.');
    const oque = alvo ? 'do evento selecionado' : 'de TODOS os eventos';
    if(!confirm('Apagar todos os compradores, pedidos e ingressos '+oque+'?\n\nIsso não tem volta.')) return;
    setOc(true);
    const {data,error} = await db.rpc('ev_limpar_compradores',
      {p_confirmacao:'APAGAR', p_evento: alvo || null});
    setOc(false);
    if(error){
      return setErro(error.message.indexOf('CONFIRMACAO')>=0
        ? 'Confirmação inválida.' : error.message);
    }
    setRes(data); setConf('');
    flash('Dados de compradores apagados');
  }

  return html`<div class="perigo" style="margin-top:22px">
    <div class="dsp" style="font-size:19px;color:var(--bad)">Apagar dados de compradores</div>
    <p class="mute" style="font-size:13px;margin:8px 0 16px">
      Remove clientes, pedidos, ingressos e registros de portaria. As festas, os lotes
      e estas configurações <b style="color:var(--bone)">não são apagados</b> — e o estoque
      volta a contar do zero. Serve para limpar testes antes de abrir as vendas de verdade.</p>

    ${res ? html`<div class="ok">Apagados: ${res.ingressos} ingresso(s), ${res.pedidos} pedido(s),
      ${res.clientes} cliente(s) e ${res.checkins} registro(s) de portaria.</div>` : null}

    <div class="field"><label>O que apagar</label>
      <select value=${alvo} onChange=${x=>setAlvo(x.target.value)}>
        <option value="">Todos os eventos</option>
        ${evs.map(e=>html`<option key=${e.id} value=${e.id}>Só: ${e.nome} — ${dataBR(e.data)}</option>`)}
      </select></div>
    <div class="field"><label>Digite APAGAR para confirmar</label>
      <input value=${conf} placeholder="APAGAR" onInput=${x=>setConf(x.target.value)}/></div>
    ${erro ? html`<div class="err">${erro}</div>` : null}
    <button class="btn wide" style="background:var(--bad);color:#fff"
      onClick=${apagar} disabled=${ocupado||conf.trim().toUpperCase()!=='APAGAR'}>
      ${ocupado ? 'Apagando…' : 'Apagar dados de compradores'}</button>
  </div>`;
}

/* ============ APP ============ */
function App(){
  const rota = useHash();
  const [cfg,setCfg] = useState({});
  useEffect(()=>{ db.rpc('ev_config_publica').then(({data})=>{
    const o={}; Object.keys(data||{}).forEach(k=>{ o[k] = typeof data[k]==='string' ? data[k] : String(data[k]); });
    setCfg(o); }, ()=>{}); },[]);
  useEffect(()=>{ if(cfg.nome_plataforma) document.title = cfg.nome_plataforma+' — Ingressos';
    if(cfg.hero_texto){ const m=document.querySelector('meta[name=description]'); if(m) m.content=cfg.hero_texto; } },[cfg]);

  if(rota.indexOf('/checkin')===0)    return html`<${Checkin}/>`;
  if(rota.indexOf('/t/')===0)         return html`<${TicketPublico} token=${rota.split('/')[2]} cfg=${cfg}/>`;
  if(rota.indexOf('/admin')===0)      return html`<${Admin} rota=${rota}/>`;
  if(rota.indexOf('/evento/')===0)    return html`<${Evento} slug=${rota.split('/')[2]} cfg=${cfg}/>`;
  if(rota.indexOf('/pagamento/')===0) return html`<${Pagamento} id=${rota.split('/')[2]} cfg=${cfg}/>`;
  if(rota.indexOf('/ingresso/')===0)  return html`<${Ingresso} id=${rota.split('/')[2]} cfg=${cfg}/>`;
  return html`<${Home} cfg=${cfg}/>`;
}

try{
  const raiz = document.getElementById('app');
  raiz.innerHTML = '';
  render(html`<${App}/>`, raiz);
  window.__glamOk = true;
}catch(e){
  window.__glamFalhou((e && e.message) || String(e));
}
</script>
</body>
</html>
